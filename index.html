<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 外层壳页同样关掉双击缩放：iframe 内的点击延迟判断取自最外层视口，
         外壳允许缩放时，内页即使写了 touch-action:manipulation 也可能被判成双击 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>畅影-字幕服务影视制作</title>
    <style>
        /* 原文件这里是两段互相冲突的样式（overflow:hidden 又 overflow:auto、
           .container 又是 100% 又是 min-height:100vh），浏览器要覆盖一遍规则、
           移动端还会因为 100vh 随地址栏变化反复重排。合并成一份。 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;              /* 外壳不滚动，滚动交给 iframe，避免"两层滚动"抢手势 */
            overscroll-behavior: none;     /* 去掉 iOS 的橡皮筋回弹 */
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            height: 100dvh;                /* 地址栏收起时自动跟随，不会留白或被裁切 */
        }
        #resumeFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #F9FAFB;
        }
        .error-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe
            id="resumeFrame"
            src="https://link-1252777009.cos-website.ap-beijing.myqcloud.com/sub/index.html"
            onload="handleLoad()"
            onerror="handleError()"
            allowfullscreen
            allow="fullscreen"
        ></iframe>
        <div class="error-message" id="errorMessage">
            <h2>抱歉，网页载入失败</h2>
            <p>请检查网络连接或稍后再试</p>
            <button onclick="retryLoad()">重试</button>
        </div>
    </div>

    <!-- 可选：在页面顶部增加提示 
    <div style="position: absolute; top: 10px; left: 10px; z-index: 9999; background: #fffbe6; color: #333; padding: 8px 16px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-size: 15px;">
        建议直接访问 <a href="index.html" style="color: #165DFF;">index.html</a> 获得最佳体验，iframe模式部分功能可能受限。
    </div>-->

    <script>
        // 配置项：可自定义开启/关闭各项禁止功能
        const securityConfig = {
            disableRightClick: true,    // 禁止右键
            disableSave: true,          // 禁止Ctrl+S
            disablePrint: true,         // 禁止Ctrl+P
            disableViewSource: true,    // 禁止Ctrl+U
            disableCopy: false,          // 禁止Ctrl+C
            disablePaste: true,         // 禁止Ctrl+V
            disableSelectAll: true,     // 禁止Ctrl+A
            disableDevTools: true,      // 禁止开发者工具
            disableKeyboard: true,      // 禁止键盘快捷键
            disableDrag: true,          // 禁止拖拽
            disableSelect: false        // 禁止选中文本
        };

        // 初始化安全限制
        function initSecurityRestrictions() {
            // 禁止右键菜单
            if (securityConfig.disableRightClick) {
                document.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                });
            }

            // 禁止选中文本
            if (securityConfig.disableSelect) {
                document.body.style.userSelect = 'none';
                document.body.style.webkitUserSelect = 'none';
            }

            // 禁止拖拽
            if (securityConfig.disableDrag) {
                document.addEventListener('dragstart', function(e) {
                    e.preventDefault();
                });
            }

            // 禁止键盘快捷键
            if (securityConfig.disableKeyboard) {
                document.addEventListener('keydown', function(e) {
                    // 禁止 Ctrl+S (保存)
                    if (securityConfig.disableSave && (e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        return false;
                    }
                    
                    // 禁止 Ctrl+P (打印)
                    if (securityConfig.disablePrint && (e.ctrlKey || e.metaKey) && e.key === 'p') {
                        e.preventDefault();
                        return false;
                    }
                    
                    // 禁止 Ctrl+U (查看源代码)
                    if (securityConfig.disableViewSource && (e.ctrlKey || e.metaKey) && e.key === 'u') {
                        e.preventDefault();
                        return false;
                    }
                    
                    // 禁止 Ctrl+C (复制)
                    if (securityConfig.disableCopy && (e.ctrlKey || e.metaKey) && e.key === 'c') {
                        e.preventDefault();
                        return false;
                    }
                    
                    // 禁止 Ctrl+V (粘贴)
                    if (securityConfig.disablePaste && (e.ctrlKey || e.metaKey) && e.key === 'v') {
                        e.preventDefault();
                        return false;
                    }
                    
                    // 禁止 Ctrl+A (全选)
                    if (securityConfig.disableSelectAll && (e.ctrlKey || e.metaKey) && e.key === 'a') {
                        e.preventDefault();
                        return false;
                    }
                    
                    // 禁止开发者工具相关快捷键
                    if (securityConfig.disableDevTools) {
                        // 禁止 F12
                        if (e.key === 'F12') {
                            e.preventDefault();
                            return false;
                        }
                        
                        // 禁止 Ctrl+Shift+I
                        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'i') {
                            e.preventDefault();
                            return false;
                        }
                        
                        // 禁止 Ctrl+Shift+J
                        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'j') {
                            e.preventDefault();
                            return false;
                        }
                        
                        // 禁止 Ctrl+Shift+C
                        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'c') {
                            e.preventDefault();
                            return false;
                        }
                    }
                });
            }
        }

        // 页面加载完成后初始化安全限制
        document.addEventListener('DOMContentLoaded', function() {
            initSecurityRestrictions();
        });

        // 注意：原来这里有一个 beforeunload 监听，会把 iframe 的 src 重新赋一次，
        // 等于页面卸载时再触发一次内页加载；在手机上表现为"返回/刷新后白屏一会儿"，
        // 而且会打断内页正在进行的交互，已移除。

        function handleLoad() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        function handleError() {
            document.getElementById('resumeFrame').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }

        function retryLoad() {
            const resumeFrame = document.getElementById('resumeFrame');
            resumeFrame.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            resumeFrame.src = resumeFrame.src;
        }
    </script>
</body>
</html>
